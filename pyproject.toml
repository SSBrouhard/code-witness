[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "debt-compiler"
version = "0.1.0"
description = "A deterministic contract-pack extractor for bounded Python slices"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["tree-sitter==0.25.2", "tree-sitter-python==0.25.0"]

[project.scripts]
debt-compiler = "debt_compiler.cli:main"

[tool.setuptools.packages.find]
include = ["debt_compiler*"]
